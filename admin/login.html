<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login Admin</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <img class="login-logo" src="assets/madiva-studio-logo.png" alt="Logo Madiva Studio" />
      <p class="admin-eyebrow">Wedding Invitation</p>
      <h1>Wedding Admin</h1>
      <p>Masuk untuk mengelola undangan.</p>
      <form id="login-form" novalidate>
        <label
          >Username<input
            name="username"
            autocomplete="username"
            required /></label
        ><label
          >Password<input
            name="password"
            type="password"
            autocomplete="current-password"
            required
        /></label>
        <p id="login-error" class="form-error" aria-live="polite"></p>
        <button class="admin-button" type="submit">Masuk</button>
      </form>
    </main>
    <script src="js/auth.js"></script>
  </body>
</html>
